{% extends 'base.html' %}
{% load static %}

{% block title %}خطا در ثبت سفارش{% endblock %}

{% block content %}

<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-3">خطا در ثبت سفارش!</h2>
                    <p class="text-muted mb-4">
                        متأسفانه ثبت سفارش شما با مشکل مواجه شد. لطفاً دوباره تلاش کنید.
                    </p>
                    
                    <div class="d-flex gap-3 justify-content-center">
                        <a href="{% url 'cart:summary' %}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-right"></i> بازگشت به سبد خرید
                        </a>
                        <a href="{% url 'payment:wallet' %}" class="btn btn-primary">
                            <i class="bi bi-wallet2"></i> بررسی کیف پول
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
