{% extends 'dashboard/admin/base.html' %}

{% block title %}حذف برند{% endblock %}

{% block content %}
<div class="container-fluid py-4">

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 text-center p-4">
                <div class="card-body">
                    <div class="text-danger fs-1 mb-3">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <h5 class="fw-bold mb-2">تایید حذف برند</h5>
                    <p class="text-muted fs-7 mb-4">
                        آیا از حذف برند <strong>«{{ object.name }}»</strong> اطمینان دارید؟
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-danger px-4">بله، حذف شود</button>
                            <a href="{% url 'dashboard:admin:brands:brand-list' %}" class="btn btn-outline-secondary px-4">انصراف</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
