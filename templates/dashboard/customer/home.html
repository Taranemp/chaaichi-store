{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm" style="border-radius: 16px;">
            <div class="card-body p-4 p-md-5">
                <h4 class="fw-bold mb-2">
                    سلام {{ request.user.profile.get_fullname|default:request.user.phone }} 👋
                </h4>
                <p class="text-muted mb-4">به پنل کاربری چایچی خوش آمدید.</p>

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="border rounded-3 p-3 h-100">
                            <div class="text-muted small mb-1">شماره تماس</div>
                            <div class="fw-semibold">{{ request.user.phone }}</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="border rounded-3 p-3 h-100">
                            <div class="text-muted small mb-1">ایمیل</div>
                            <div class="fw-semibold">{{ request.user.email|default:"ثبت نشده" }}</div>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-4">
                    <a href="{% url 'shop:product_grid' %}" class="btn btn-success">
                        <i class="bi bi-shop me-1"></i>
                        مشاهده فروشگاه
                    </a>
                    <a href="{% url 'cart:summary' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-cart me-1"></i>
                        سبد خرید
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
