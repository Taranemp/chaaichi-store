{% load static %}

<link rel="stylesheet" href="{% static 'css/theme-swiss.css' %}">

<nav class="navbar navbar-expand-lg sw-navbar sticky-top">
  <div class="container">

    <!-- لوگو -->
    <a class="navbar-brand sw-logo" href="{% url 'website:index' %}">
      <span class="sw-logo-word">Chaai Chi</span>
      <span class="sw-logo-sub">فروشگاه تخصصی چای</span>
    </a>

    <!-- دکمه موبایل -->
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="باز کردن منو">
      <i class="bi bi-list fs-2"></i>
    </button>

    <!-- منو -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto sw-nav">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'website:index' %}">خانه</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">دسته‌بندی</a>
          <ul class="dropdown-menu sw-dropdown mt-2">
            <li><a class="dropdown-item" href="{% url 'shop:product_grid' %}?category_id=1">چای سیاه</a></li>
            <li><a class="dropdown-item" href="{% url 'shop:product_grid' %}?category_id=2">چای سبز</a></li>
            <li><a class="dropdown-item" href="{% url 'shop:product_grid' %}?category_id=3">دمنوش</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item fw-semibold" href="{% url 'shop:product_grid' %}">همه محصولات</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'website:about' %}">درباره ما</a>
        </li>

        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'website:contact' %}">تماس با ما</a>
        </li>
      </ul>

      <!-- سمت راست -->
      <div class="d-flex align-items-center sw-actions">

        <button class="sw-icon-btn" type="button" aria-label="جستجو">
          <i class="bi bi-search"></i>
        </button>

        <a href="{% url 'cart:summary' %}" class="sw-icon-btn position-relative" aria-label="سبد خرید">
          <i class="bi bi-basket"></i>
          <span id="cart-count" class="sw-cart-count">{{ cart.get_total_quantity|default:0 }}</span>
        </a>

        {% if user.is_authenticated %}
        <div class="dropdown">
          <button class="sw-icon-btn" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-label="حساب کاربری">
            <i class="bi bi-person"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end sw-dropdown mt-2">
            <li><a class="dropdown-item" href="{% url 'dashboard:home' %}">پروفایل</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="{% url 'account:logout' %}">خروج</a></li>
          </ul>
        </div>
        {% else %}
        <div class="dropdown">
          <button class="sw-icon-btn" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-label="ورود یا ثبت‌نام">
            <i class="bi bi-person"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end sw-dropdown mt-2">
            <li><a class="dropdown-item" href="{% url 'account:login' %}">ورود</a></li>
            <li><a class="dropdown-item" href="{% url 'account:signup' %}">ثبت‌نام</a></li>
          </ul>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</nav>

<style>
    .sw-navbar {
        background: #FDFDFB;
        border-bottom: 1px solid #E4E1DA;
        padding: 1.1rem 0;
        z-index: 1030;
    }
    .sw-logo { display: flex; flex-direction: column; line-height: 1.25; text-decoration: none; }
    .sw-logo-word { font-weight: 800; font-size: 1.3rem; letter-spacing: -.01em; color: #171614; }
    .sw-logo-sub { font-size: .68rem; color: #6B6862; }

    .sw-nav { gap: 0; }
    .sw-nav .nav-item { position: relative; padding: 0 1.1rem; }
    .sw-nav .nav-item:not(:last-child)::after {
        content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
        width: 1px; height: 14px; background: #E4E1DA;
    }
    .sw-nav .nav-link {
        color: #171614 !important;
        font-size: .92rem;
        font-weight: 500;
        padding: .4rem 0 !important;
        border-bottom: 1px solid transparent;
    }
    .sw-nav .nav-link:hover,
    .sw-nav .nav-link.active { border-bottom-color: #1B4332; }
    .sw-nav .dropdown-toggle::after { vertical-align: 1px; }

    .sw-dropdown {
        border: 1px solid #E4E1DA;
        border-radius: 4px;
        box-shadow: none;
    }
    .sw-dropdown .dropdown-item { padding: .55rem 1rem; font-size: .9rem; }
    .sw-dropdown .dropdown-item:hover { background: #EEF1EC; color: #1B4332; }

    .sw-actions { gap: .35rem; }
    .sw-icon-btn {
        width: 38px; height: 38px;
        display: inline-flex; align-items: center; justify-content: center;
        background: transparent; border: none; color: #171614; font-size: 1.05rem;
        border-radius: 4px;
    }
    .sw-icon-btn:hover { background: #EEF1EC; }
    .sw-cart-count {
        position: absolute; top: 2px; left: 2px;
        width: 15px; height: 15px; border-radius: 50%;
        background: #A6602B; color: #fff; font-size: 9px;
        display: flex; align-items: center; justify-content: center;
    }

    @media (max-width: 991px) {
        .sw-nav .nav-item:not(:last-child)::after { display: none; }
        .sw-actions { margin-top: 1rem; }
    }
</style>
