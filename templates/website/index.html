{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- Hero Section -->
<div class="container py-5">
    <div class="row align-items-center">
        <div class="col-lg-6">
            <h1 class="display-4 fw-bold text-primary">چای اصل لاهیجان</h1>
            <p class="lead">فروشگاه تخصصی انواع چای ایرانی و خارجی</p>
            <a href="/shop/" class="btn btn-primary btn-lg rounded-pill">مشاهده محصولات</a>
        </div>
        <div class="col-lg-6">
            <img src="{% static 'img/hero-tea.jpg' %}" alt="Tea" class="img-fluid rounded shadow">
        </div>
    </div>
</div>

<!-- Features -->
<div class="bg-light py-5">
    <div class="container">
        <div class="row text-center">
            <div class="col-md-4">
                <i class="bi bi-cup-hot fs-1 text-primary"></i>
                <h4>چای تازه</h4>
                <p>تهیه شده از بهترین باغات لاهیجان</p>
            </div>
            <div class="col-md-4">
                <i class="bi bi-truck fs-1 text-primary"></i>
                <h4>ارسال سریع</h4>
                <p>ارسال به سراسر کشور</p>
            </div>
            <div class="col-md-4">
                <i class="bi bi-shield-check fs-1 text-primary"></i>
                <h4>ضمانت کیفیت</h4>
                <p>تضمین اصالت کالا</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
